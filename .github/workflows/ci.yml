# Tests on every push and pull request, on each system Mutabor ships for.
# The ignored tests run every recipe on the real bundled ffmpeg of that system.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # tesseract-rs compiles Tesseract into a folder of its own, outside target.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.tesseract-rs
            ~/Library/Application Support/tesseract-rs
            ~/AppData/Roaming/tesseract-rs
          key: tesseract-rs-0.4.0-${{ runner.os }}-${{ runner.arch }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run check-locales

      - name: Fetch ffmpeg (checked by SHA-256)
        run: npm run tools

      # Skipped: the real clipboard, and tests that need the optional engines.
      - name: Rust tests, recipes on the real ffmpeg
        working-directory: src-tauri
        run: cargo test -- --include-ignored --skip clipboard --skip tools_run --skip downloads --skip unpacks
