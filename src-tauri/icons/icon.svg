      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <g fill="none" stroke="#fff" stroke-width="64" stroke-linecap="round">
    <path d="M 262 430 A 260 260 0 0 1 700 300"/>
    <path d="M 762 594 A 260 260 0 0 1 324 724"/>
  </g>
  <g fill="#fff">
    <path d="M 760 236 L 770 392 L 626 340 Z"/>
    <path d="M 264 788 L 254 632 L 398 684 Z"/>
