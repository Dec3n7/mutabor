<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- "Mutabor!" turns the caliph into a stork in Hauff's tale ("Kalif Storch"):
       a golden stork under a crescent moon, on a night-sky tile. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1e2140"/>
      <stop offset="1" stop-color="#0b0c18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d27a"/>
      <stop offset="1" stop-color="#d99a2b"/>
    </linearGradient>
    <mask id="crescent">
      <circle cx="750" cy="250" r="110" fill="#fff"/>
      <circle cx="796" cy="216" r="96" fill="#000"/>
    </mask>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#sky)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="#f6d27a" stroke-opacity="0.18" stroke-width="8"/>

  <!-- Moon and a few stars -->
  <rect x="620" y="120" width="260" height="260" fill="url(#gold)" mask="url(#crescent)"/>
  <g fill="#f6d27a">
    <circle cx="230" cy="200" r="9"/>
    <circle cx="560" cy="150" r="7"/>
    <circle cx="840" cy="560" r="8"/>
  </g>

  <!-- Stork, facing left: long beak, S-shaped neck, standing on one leg -->
  <g fill="url(#gold)">
    <circle cx="400" cy="236" r="38"/>
    <path d="M 372 226 L 196 318 L 380 258 Z"/>
    <path d="M 376 252 C 360 330, 410 400, 480 432 L 520 392 C 462 370, 430 320, 432 246 Z"/>
    <path d="M 462 450 C 482 368, 626 352, 708 392 L 836 424 L 706 452 C 654 524, 504 536, 462 450 Z"/>
  </g>
  <!-- wing line, cut out of the body -->
  <path d="M 556 418 C 616 402, 690 410, 770 434" fill="none" stroke="#141629" stroke-width="16" stroke-linecap="round"/>
  <g fill="none" stroke="#e8b452" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 586 500 L 586 846" stroke-width="22"/>
    <path d="M 616 500 L 690 610 L 600 650" stroke-width="20"/>
    <path d="M 540 852 L 640 852" stroke-width="18"/>
  </g>
</svg>
