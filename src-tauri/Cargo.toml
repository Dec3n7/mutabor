[package]
name = "mutabor"
version = "0.1.0"
description = "Offline file converter: select a file, press a hotkey, pick an action"
authors = ["Dec3n7"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Dec3n7/mutabor"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mutabor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.5.0"
sha2 = "0.11.1"
resvg = "0.49.0"
base64 = "0.23.1"
tract-onnx = "0.23.9"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Dependencies are optimised even in debug builds: unoptimised TLS and SHA-256
# download engines at a few dozen KB/s.
[profile.dev.package."*"]
opt-level = 2
