<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Mutabor</title>
    <script type="module" src="/src/settings.ts" defer></script>
  </head>
  <body class="settings">
    <h1 data-t="s_title"></h1>

    <section>
      <label data-t="s_hotkey"></label>
      <div class="line">
        <button id="hotkey" class="field"></button>
        <button id="hotkey-reset" class="link" data-t="s_hotkey_reset"></button>
      </div>
      <p class="note" data-t="s_hotkey_note"></p>
    </section>

    <section>
      <label for="language" data-t="s_language"></label>
      <select id="language" class="field">
        <option value="auto" data-t="s_lang_auto"></option>
        <option value="ru">Русский</option>
        <option value="en">English</option>
      </select>
    </section>

    <section>
      <label data-t="s_quality"></label>
      <div class="chips" id="quality"></div>
      <p class="note" data-t="s_quality_note"></p>
    </section>

    <section>
      <label class="check"><input type="checkbox" id="remember" /> <span data-t="s_remember"></span></label>
      <button id="forget" class="link"></button>
      <label class="check"><input type="checkbox" id="copy-result" /> <span data-t="s_copy_result"></span></label>
      <p class="note" data-t="s_copy_result_note"></p>
    </section>

    <section>
      <label data-t="s_queue"></label>
      <div id="parallel" class="grid"></div>
      <p class="note" data-t="s_queue_note"></p>
    </section>

    <section>
      <label data-t="s_action_hotkeys"></label>
      <div id="action-hotkeys"></div>
      <div class="line">
        <select id="hotkey-action" class="field"></select>
        <button id="hotkey-add" class="link" data-t="s_assign"></button>
      </div>
      <p class="note" data-t="s_action_hotkeys_note"></p>
    </section>

    <section>
      <label data-t="s_custom"></label>
      <div id="custom"></div>
      <div id="editor" hidden></div>
      <div class="line">
        <button id="custom-new" class="link" data-t="s_custom_new"></button>
        <button id="custom-export" class="link" data-t="s_export"></button>
        <button id="custom-import" class="link" data-t="s_import"></button>
      </div>
      <div id="import-box" hidden>
        <textarea id="import-text" class="field code" rows="5" spellcheck="false"></textarea>
        <button id="import-go" class="link" data-t="s_import_go"></button>
      </div>
      <p class="note" data-t="s_custom_note"></p>
    </section>

    <section>
      <label data-t="s_engines"></label>
      <div id="engines"></div>
      <p class="note" data-t="s_engines_note"></p>
    </section>

    <footer>
      <span id="about"></span>
      <span id="saved"></span>
    </footer>
  </body>
</html>
